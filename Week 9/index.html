<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WanderGo - Travel Planner</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="page">

        <!-- Navbar -->
        <header class="navbar">
            <h1 class="logo">WanderGo</h1>

            <nav class="nav-links">
                <a href="#home">Home</a>
                <a href="#trips">Trips</a>
                <a href="#contact">Contact</a>
            </nav>
        </header>

        <!-- Hero Section -->
        <main id="home">

            <section class="hero">
                <div class="hero-content">
                    <h2>Plan your next trip in minutes and seconds.</h2>
                    <p>Simple, cheap and fun travel plans. </p>
                </div>

                <img
                    src="trip.jpg"
                    alt="Beautiful travel destination"
                    class="trip-image"
                >
            </section>

            <!-- Features -->
            <section class="features" id="trips">

                <article class="feature-card">
                    <h3>Easy Booking in minutes</h3>
                    <p>Book in 3 clicks.</p>
                </article>

                <article class="feature-card">
                    <h3>Best Prices</h3>
                    <p>We compare for you.</p>
                </article>

                <article class="feature-card">
                    <h3>24x7 Help</h3>
                    <p>We are here for you.</p>
                </article>

            </section>

        </main>

        <!-- Footer -->
        <footer class="footer" id="contact">
            <p>© 2026 WanderGo. Explore more.</p>
        </footer>

    </div>

</body>
</html>
