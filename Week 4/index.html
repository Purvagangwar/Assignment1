<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Welcome to our college website. Explore college events and activities.">
    <meta name="author" content="Purva">
    <meta name="keywords" content="college, events, education">
    <title> Registration form</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
</head>

<body>
    <nav>
        <a href="index.html">Home</a> |
        <a href="about.html">About</a> |
        <a href="register.html">Register</a> |
        <a href="contact.html">Contact</a>
    </nav>

    <h1> Registration form</h1>
    <form>
        <!--Name-->
        <label for="name">Name:</label>
        <input type="text" id="name" name="name" required>
        <br> <br>

        <!-- email -->
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br> <br>

        <!-- password -->
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br> <br>
        <!-- Date -->
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required>
        <br><br>

        <!-- Phone -->
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>
        <br><br>

        <!-- Radio Buttons -->
        <p>Gender:</p>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label>
        <br><br>

        <!-- Checkboxes -->
        <p>Choose Your Interests:</p>
        <input type="checkbox" id="coding" name="interests" value="coding">
        <label for="coding">Coding</label>

        <input type="checkbox" id="gaming" name="interests" value="gaming">
        <label for="gaming">Gaming</label>

        <input type="checkbox" id="sports" name="interests" value="sports">
        <label for="sports">Sports</label>
        <br><br>

        <!-- Dropdown -->
        <label for="course">Select Your Course:</label>
        <select id="course" name="course" required>
            <option value="">-- Select a Course --</option>
            <option value="cse">Computer Science</option>
            <option value="it">Information Technology</option>
            <option value="ece">Electronics Engineering</option>
            <option value="mechanical">Mechanical Engineering</option>
        </select>
        <br><br>

        <!-- Message Box -->
        <label for="message">Your Message:</label>
        <br>
        <textarea id="message" name="message" rows="5" cols="30" placeholder="Write your message here"></textarea>
        <br><br>

        <!-- Submit Button -->
        <button type="submit">Submit</button>

        <h1>College Events</h1>
        <h1>College Events</h1>

        <table border="4">
            <!-- Heading Row -->
            <thead>
                <tr>
                    <th>Event Name</th>
                    <th>Date</th>
                    <th>Venue</th>
                </tr>
            </thead>

            <!-- Body Rows -->
            <tbody>
                <tr>
                    <td>Hackathon</td>
                    <td>10 November 2026</td>
                    <td>Computer Lab</td>
                </tr>

                <tr>
                    <td>Annual Sports Day</td>
                    <td>15 November 2026</td>
                    <td>College Ground</td>
                </tr>
                <tr>
                <td>Technical Fest</td>
                <td>20 November 2026</td>
                <td>Main Auditorium</td>
            </tr>
        </tbody>



</body>

</html>
