<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <!-- Header -->
        <header class="head">
            <h2>My Dashboard</h2>
        </header>

        <!-- Sidebar -->
        <aside class="side">
            <h3>Menu</h3>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">Reports</a></li>
                <li><a href="#">Settings</a></li>
            </ul>
        </aside>

        <!-- Main Content -->
        <main class="main">

            <div class="card">
                <span class="icon">👤</span>
                <div class="info">
                    <strong>120</strong>
                    <p>Users </p>
                </div>
            </div>

            <div class="card">
                <span class="icon">💰</span>
                <div class="info">
                    <strong>Rs 45k</strong>
                    <p>Sales</p>
                </div>
            </div>

            <div class="card">
                <span class="icon">📦</span>
                <div class="info">
                    <strong>36</strong>
                    <p>Order</p>
                </div>
            </div>

            <div class="card">
                <span class="icon">⭐</span>
                <div class="info">
                    <strong>4.8</strong>
                    <p>Ratings</p>
                </div>
            </div>

            <div class="card">
                <span class="icon">💬</span>
                <div class="info">
                    <strong> 18 </strong>
                    <p>Messages</p>
                </div>
            </div>

            <div class="card">
                <span class="icon">✅</span>
                <div class="info">
                    <strong>92% </strong>
                    <p>Done</p>
                </div>
            </div>

        </main>

        <!-- Footer -->
        <footer class="foot">
            <p>Made with CSS Grid</p>
        </footer>

    </div>

</body>
</html>
